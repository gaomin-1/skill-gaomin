case_id: TSBF-SK-MKT-STR-004-CASE-001
brand:
  name: 天生不凡 AI OS
  product: 面向中小制造工厂的经营协同 AI OS
  category: 制造业经营管理软件
target_market: 拥有 20-200 人团队、订单与交付协同复杂的中小制造工厂
customer_pains:
  - 订单、交期、物料和责任人信息分散，老板无法快速判断经营风险
  - 缺料、延期和跨部门问题出现后，行动没有负责人、时限和关闭证据
  - 工厂已经有表格或 ERP，但经营层缺少统一的异常闭环视图
jobs_to_be_done:
  - 每天快速知道哪些异常会影响交期和现金流
  - 把异常从发现推进到核验、分级、行动、确认和复盘
proof_points:
  - 总仓库已有 AI 数字工厂缺料异常合成演练
  - 控制台可以展示资产编号、状态、人工门禁和执行轨迹
competitor_alternatives:
  - 继续依赖微信群、Excel 和个人经验
  - 只购买 ERP 模块但不改变异常协同流程
constraints:
  - 本案例为合成演示，不代表真实客户效果
  - 不承诺自动替代管理者，不连接真实 ERP 或外部消息系统
